/* =====================================================
   ADMIN PASSWORD
===================================================== */

const ADMIN_PASSWORD = "kbnation";


/* =====================================================
   PASSWORD CHECK
===================================================== */

function checkAdminPassword() {

  const password =
    document.getElementById(
      "adminPassword"
    ).value;

  const message =
    document.getElementById(
      "passwordMessage"
    );


  if (password === ADMIN_PASSWORD) {

    /*
      Hide password screen
    */

    document.getElementById(
      "passwordGate"
    ).style.display = "none";


    /*
      Show website
    */

    document.getElementById(
      "mainSite"
    ).style.display = "block";


    /*
      Clear password field
    */

    document.getElementById(
      "adminPassword"
    ).value = "";


    message.textContent = "";

  } else {

    message.textContent =
      "Incorrect password. Please try again.";

    document.getElementById(
      "adminPassword"
    ).value = "";

    document.getElementById(
      "adminPassword"
    ).focus();

  }

}


/* =====================================================
   ENTER KEY FOR PASSWORD
===================================================== */

function handlePasswordKey(event) {

  if (event.key === "Enter") {

    checkAdminPassword();

  }

}


/* =====================================================
   AGORA CONFIGURATION
===================================================== */

const APP_ID =
  "aaaf093cb1944721bf39fb62659394a2";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let client = null;

let localAudioTrack = null;

let currentChannel = "";

let currentUid = null;

let currentName = "";

let muted = false;


/* =====================================================
   STATUS
===================================================== */

function setStatus(message) {

  document.getElementById(
    "status"
  ).textContent = message;

}


/* =====================================================
   CREATE ROOM NAME
===================================================== */

function createChannelName(roomName) {

  return roomName
    .trim()
    .replace(/\s+/g, "-")
    .replace(/[^a-zA-Z0-9_-]/g, "")
    .substring(0, 50);

}


/* =====================================================
   CREATE UNIQUE UID
===================================================== */

function createUid() {

  return Math.floor(
    100000000 +
    Math.random() * 900000000
  );

}


/* =====================================================
   GET AGORA TOKEN
===================================================== */

async function getToken(
  channelName,
  uid
) {

  const response =
    await fetch(
      "/api/token",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          channelName:
            channelName,

          uid: uid
        })
      }
    );


  if (!response.ok) {

    throw new Error(
      "Token server returned HTTP " +
      response.status
    );

  }


  const data =
    await response.json();


  if (!data.token) {

    throw new Error(
      "No Agora token was returned by /api/token"
    );

  }


  return data.token;

}


/* =====================================================
   JOIN ROOM
===================================================== */

async function joinRoom() {

  const nameInput =
    document.getElementById("name");

  const roomInput =
    document.getElementById("roomName");


  currentName =
    nameInput.value.trim();


  const enteredRoom =
    roomInput.value.trim();


  if (!currentName) {

    setStatus(
      "Please enter your name."
    );

    nameInput.focus();

    return;

  }


  if (!enteredRoom) {

    setStatus(
      "Please enter a prayer room name."
    );

    roomInput.focus();

    return;

  }


  currentChannel =
    createChannelName(
      enteredRoom
    );


  if (!currentChannel) {

    setStatus(
      "Please enter a valid prayer room name."
    );

    return;

  }


  try {

    setStatus(
      "Connecting to prayer room..."
    );


    document.getElementById(
      "joinButton"
    ).disabled = true;


    client =
      AgoraRTC.createClient({
        mode: "rtc",
        codec: "vp8"
      });


    client.on(
      "user-published",
      async (
        user,
        mediaType
      ) => {

        try {

          await client.subscribe(
            user,
            mediaType
          );


          if (
            mediaType === "audio"
          ) {

            user.audioTrack.play();

          }

        } catch (error) {

          console.error(
            "Subscribe error:",
            error
          );

        }

      }
    );


    client.on(
      "user-unpublished",
      (
        user,
        mediaType
      ) => {

        if (
          mediaType === "audio"
        ) {

          removeParticipant(
            user.uid
          );

        }

      }
    );


    client.on(
      "user-left",
      (
        user
      ) => {

        removeParticipant(
          user.uid
        );

      }
    );


    client.on(
      "connection-state-change",
      (
        curState,
        prevState
      ) => {

        console.log(
          "Agora connection:",
          prevState,
          "→",
          curState
        );


        const connectionStatus =
          document.getElementById(
            "connectionStatus"
          );


        if (
          curState === "CONNECTED"
        ) {

          connectionStatus.textContent =
            "Connected to prayer room";

        }

        else if (
          curState === "RECONNECTING"
        ) {

          connectionStatus.textContent =
            "Reconnecting...";

        }

        else if (
          curState === "DISCONNECTED"
        ) {

          connectionStatus.textContent =
            "Disconnected";

        }

      }
    );


    currentUid =
      createUid();


    const token =
      await getToken(
        currentChannel,
        currentUid
      );


    await client.join(
      APP_ID,
      currentChannel,
      token,
      currentUid
    );


    localAudioTrack =
      await AgoraRTC.createMicrophoneAudioTrack();


    await client.publish(
      [localAudioTrack]
    );


    document.getElementById(
      "joinCard"
    ).style.display = "none";


    document.getElementById(
      "roomCard"
    ).style.display = "block";


    document.getElementById(
      "roomTitle"
    ).textContent =
      enteredRoom;


    document.getElementById(
      "connectionStatus"
    ).textContent =
      "Connected to prayer room";


    setStatus(
      "You are now connected."
    );


    addParticipant(
      currentUid,
      currentName,
      true
    );


    client.remoteUsers.forEach(
      user => {

        addParticipant(
          user.uid,
          "Prayer Participant",
          false
        );

      }
    );


  } catch (error) {

    console.error(
      "Join error:",
      error
    );


    let message =
      "Unable to join prayer room.";


    if (
      error &&
      error.message
    ) {

      message =
        error.message;

    }


    setStatus(
      message
    );


    document.getElementById(
      "joinButton"
    ).disabled = false;


    try {

      if (localAudioTrack) {

        localAudioTrack.close();

        localAudioTrack = null;

      }


      if (client) {

        await client.leave();

        client = null;

      }

    } catch (cleanupError) {

      console.error(
        cleanupError
      );

    }

  }

}


/* =====================================================
   ADD PARTICIPANT
===================================================== */

function addParticipant(
  uid,
  name,
  isSelf = false
) {

  const list =
    document.getElementById(
      "participantList"
    );


  const id =
    "participant-" + uid;


  if (
    document.getElementById(id)
  ) {

    return;

  }


  const li =
    document.createElement("li");


  li.className =
    "participant";


  li.id =
    id;


  const avatar =
    document.createElement("div");


  avatar.className =
    "participant-avatar";


  avatar.textContent =
    (name || "P")
      .charAt(0)
      .toUpperCase();


  const nameElement =
    document.createElement("div");


  nameElement.className =
    "participant-name";


  nameElement.textContent =
    name || "Prayer Participant";


  if (isSelf) {

    const badge =
      document.createElement("span");


    badge.className =
      "you-badge";


    badge.textContent =
      " YOU";


    nameElement.appendChild(
      badge
    );

  }


  li.appendChild(
    avatar
  );


  li.appendChild(
    nameElement
  );


  list.appendChild(
    li
  );


  updateParticipantCount();

}


/* =====================================================
   REMOVE PARTICIPANT
===================================================== */

function removeParticipant(uid) {

  const element =
    document.getElementById(
      "participant-" + uid
    );


  if (element) {

    element.remove();

  }


  updateParticipantCount();

}


/* =====================================================
   PARTICIPANT COUNT
===================================================== */

function updateParticipantCount() {

  const list =
    document.getElementById(
      "participantList"
    );


  const count =
    list.children.length;


  document.getElementById(
    "participantCount"
  ).textContent =
    count;

}


/* =====================================================
   MUTE / UNMUTE
===================================================== */

async function toggleMute() {

  if (!localAudioTrack) {

    return;

  }


  muted =
    !muted;


  await localAudioTrack.setEnabled(
    !muted
  );


  const button =
    document.getElementById(
      "muteButton"
    );


  if (muted) {

    button.textContent =
      "🎙️ Unmute Microphone";

  } else {

    button.textContent =
      "🔇 Mute Microphone";

  }

}


/* =====================================================
   LEAVE ROOM
===================================================== */

async function leaveRoom() {

  try {

    if (localAudioTrack) {

      localAudioTrack.stop();

      localAudioTrack.close();

      localAudioTrack =
        null;

    }


    if (client) {

      await client.leave();

      client = null;

    }

  } catch (error) {

    console.error(
      "Leave error:",
      error
    );

  }


  document.getElementById(
    "roomCard"
  ).style.display = "none";


  document.getElementById(
    "joinCard"
  ).style.display = "block";


  document.getElementById(
    "joinButton"
  ).disabled = false;


  document.getElementById(
    "participantList"
  ).innerHTML = "";


  document.getElementById(
    "participantCount"
  ).textContent = "0";


  document.getElementById(
    "connectionStatus"
  ).textContent =
    "Disconnected";


  document.getElementById(
    "muteButton"
  ).textContent =
    "🔇 Mute Microphone";


  muted = false;

  currentChannel = "";

  currentUid = null;


  setStatus(
    "You have left the prayer room."
  );

}


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
  "beforeunload",
  async () => {

    try {

      if (localAudioTrack) {

        localAudioTrack.stop();

        localAudioTrack.close();

      }


      if (client) {

        await client.leave();

      }

    } catch (error) {

      console.error(error);

    }

  }
);

</script></body>
