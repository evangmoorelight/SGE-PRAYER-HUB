<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SGE PRAYER HUB</title>

  <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #15294a 0%, #0b1220 45%);
      color: white;
    }

    header {
      padding: 24px 18px;
      text-align: center;
      background: rgba(17, 28, 49, .92);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    header h1 {
      font-size: 28px;
      font-weight: 800;
    }

    header p {
      margin-top: 7px;
      color: #9caac0;
      font-size: 14px;
    }

    .container {
      width: min(94%, 620px);
      margin: 30px auto;
    }

    .card {
      background: rgba(17, 28, 49, .95);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #aebbd0;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #293750;
      border-radius: 12px;
      background: #09101d;
      color: white;
      outline: none;
      margin-bottom: 16px;
      font-size: 15px;
    }

    input:focus {
      border-color: #1687ff;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #1687ff;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    button:hover:not(:disabled) {
      opacity: .9;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #09101d;
      color: #aebbd0;
      font-size: 14px;
      text-align: center;
      word-break: break-word;
    }

    .status.success {
      color: #43e97b;
    }

    .status.error {
      color: #ff6b81;
    }

    .room {
      display: none;
    }

    .room.active {
      display: block;
    }

    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .room-header h2 {
      font-size: 22px;
      word-break: break-word;
    }

    .live {
      color: #43e97b;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }

    .participants {
      margin-top: 25px;
    }

    .participants h3 {
      margin-bottom: 12px;
    }

    .participant {
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 12px;
      background: #09101d;
      border: 1px solid rgba(255,255,255,.05);
    }

    .empty {
      color: #8f9db2;
      font-size: 14px;
      padding: 10px 0;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 22px;
    }

    .controls button {
      background: #1b2b46;
    }

    .controls .leave {
      background: #d92d45;
    }

    .connection {
      margin-top: 15px;
      text-align: center;
      color: #8f9db2;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 20px;
      }

      header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>SGE PRAYER HUB</h1>
  <p>Connect • Pray • Believe • Grow</p>
</header>

<div class="container">

  <!-- JOIN SCREEN -->
  <div id="joinCard" class="card">

    <label for="name">Your Name</label>

    <input
      id="name"
      type="text"
      placeholder="Enter your name"
      maxlength="30"
      autocomplete="name"
    >

    <label for="roomName">Prayer Room</label>

    <input
      id="roomName"
      type="text"
      placeholder="Example: Morning Prayer"
      maxlength="50"
    >

    <button id="joinButton" onclick="joinRoom()">
      🎙️ Join Prayer Room
    </button>

    <div id="status" class="status">
      Ready to join
    </div>

  </div>


  <!-- ROOM SCREEN -->
  <div id="room" class="card room">

    <div class="room-header">

      <div>
        <h2 id="roomTitle">Prayer Room</h2>

        <div class="connection" id="connectionStatus">
          Connected
        </div>
      </div>

      <div class="live">
        ● LIVE
      </div>

    </div>


    <div class="participants">

      <h3>
        Participants
        (<span id="participantCount">0</span>)
      </h3>

      <div id="participantList">
        <div class="empty">
          No other participants yet.
        </div>
      </div>

    </div>


    <div class="controls">

      <button
        onclick="toggleMute()"
        id="muteButton"
      >
        🎤 Mute
      </button>

      <button
        onclick="leaveRoom()"
        class="leave"
      >
        🚪 Leave
      </button>

    </div>

  </div>

</div>


<script>

const APP_ID =
  "aaaf093cb1944721bf39fb62659394a2";

let client = null;
let localAudioTrack = null;

let currentChannel = null;
let currentUid = null;
let currentName = null;

let muted = false;


/* --------------------------------
   STATUS
-------------------------------- */

function setStatus(message, type = "") {

  const status =
    document.getElementById("status");

  status.textContent = message;

  status.className =
    "status" + (type ? " " + type : "");
}


/* --------------------------------
   GET TOKEN FROM VERCEL
-------------------------------- */

async function getToken(channelName, uid) {

  const response = await fetch("/api/token", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      channelName: channelName,
      uid: uid
    })

  });

  let data;

  try {
    data = await response.json();
  } catch {
    throw new Error(
      "The token server returned an invalid response."
    );
  }

  if (!response.ok) {

    throw new Error(
      data.error ||
      "Token request failed."
    );

  }

  if (!data.token) {

    throw new Error(
      "No Agora token was returned."
    );

  }

  return data;
}


/* --------------------------------
   CREATE CHANNEL NAME
-------------------------------- */

function createChannelName(roomName) {

  return roomName
    .trim()
    .replace(/[^a-zA-Z0-9_-]/g, "-")
    .replace(/-+/g, "-")
    .substring(0, 50);
}


/* --------------------------------
   CREATE UNIQUE UID
-------------------------------- */

function createUid() {

  return Math.floor(
    100000000 +
    Math.random() * 900000000
  );

}


/* --------------------------------
   JOIN ROOM
-------------------------------- */

async function joinRoom() {

  const name =
    document
      .getElementById("name")
      .value
      .trim();

  const roomName =
    document
      .getElementById("roomName")
      .value
      .trim();

  if (!name) {

    setStatus(
      "Please enter your name.",
      "error"
    );

    return;
  }

  if (!roomName) {

    setStatus(
      "Please enter a prayer room.",
      "error"
    );

    return;
  }


  const joinButton =
    document.getElementById("joinButton");

  joinButton.disabled = true;

  setStatus(
    "Connecting to prayer room..."
  );


  try {

    currentName = name;

    currentChannel =
      createChannelName(roomName);

    currentUid =
      createUid();


    /* GET FRESH TOKEN */

    const tokenData =
      await getToken(
        currentChannel,
        currentUid
      );


    console.log(
      "Token received successfully."
    );


    /* CREATE AGORA CLIENT */

    client =
      AgoraRTC.createClient({
        mode: "rtc",
        codec: "vp8"
      });


    /* --------------------------------
       REMOTE USER PUBLISHED
    -------------------------------- */

    client.on(
      "user-published",
      async (user, mediaType) => {

        try {

          await client.subscribe(
            user,
            mediaType
          );

          console.log(
            "Subscribed to user:",
            user.uid
          );


          if (mediaType === "audio") {

            const remoteTrack =
              user.audioTrack;

            if (remoteTrack) {
              remoteTrack.play();
            }

          }


          addParticipant(
            user.uid
          );

        } catch (error) {

          console.error(
            "Subscribe error:",
            error
          );

        }

      }
    );


    /* --------------------------------
       REMOTE USER UNPUBLISHED
    -------------------------------- */

    client.on(
      "user-unpublished",
      (user, mediaType) => {

        if (mediaType === "audio") {

          console.log(
            "User stopped audio:",
            user.uid
          );

        }

      }
    );


    /* --------------------------------
       REMOTE USER LEFT
    -------------------------------- */

    client.on(
      "user-left",
      (user) => {

        console.log(
          "User left:",
          user.uid
        );

        removeParticipant(
          user.uid
        );

      }
    );


    /* --------------------------------
       NETWORK / CONNECTION STATE
    -------------------------------- */

    client.on(
      "connection-state-change",
      (curState, revState, reason) => {

        console.log(
          "Agora connection:",
          curState,
          reason
        );

        const connectionStatus =
          document.getElementById(
            "connectionStatus"
          );

        if (connectionStatus) {

          if (curState === "CONNECTED") {

            connectionStatus.textContent =
              "Connected";

          } else if (
            curState === "CONNECTING"
          ) {

            connectionStatus.textContent =
              "Connecting...";

          } else if (
            curState === "RECONNECTING"
          ) {

            connectionStatus.textContent =
              "Reconnecting...";

          } else {

            connectionStatus.textContent =
              "Connection: " + curState;

          }

        }

      }
    );


    /* --------------------------------
       JOIN AGORA CHANNEL
    -------------------------------- */

    await client.join(

      APP_ID,

      currentChannel,

      tokenData.token,

      currentUid

    );


    console.log(
      "Joined Agora channel:",
      currentChannel
    );


    /* --------------------------------
       CREATE MICROPHONE
    -------------------------------- */

    localAudioTrack =
      await AgoraRTC
        .createMicrophoneAudioTrack();


    /* --------------------------------
       PUBLISH MICROPHONE
    -------------------------------- */

    await client.publish([
      localAudioTrack
    ]);


    console.log(
      "Microphone published."
    );


    /* --------------------------------
       SHOW ROOM
    -------------------------------- */

    document
      .getElementById("joinCard")
      .style.display = "none";

    document
      .getElementById("room")
      .classList.add("active");


    document
      .getElementById("roomTitle")
      .textContent = roomName;


    addParticipant(
      currentUid,
      true,
      currentName
    );


    updateParticipantCount();


    joinButton.disabled = false;


  } catch (error) {

    console.error(
      "JOIN ERROR:",
      error
    );


    let message =
      error.message ||
      "Unable to join prayer room.";


    if (
      message
        .toLowerCase()
        .includes("token")
    ) {

      message =
        "Agora token error. Check your Vercel token API and environment variables.";

    }


    setStatus(
      message,
      "error"
    );


    /* CLEAN UP */

    if (localAudioTrack) {

      localAudioTrack.stop();
      localAudioTrack.close();

      localAudioTrack = null;

    }


    if (client) {

      try {
        await client.leave();
      } catch {}

      client = null;

    }

  } finally {

    joinButton.disabled = false;

  }

}


/* --------------------------------
   ADD PARTICIPANT
-------------------------------- */

function addParticipant(
  uid,
  local = false,
  name = ""
) {

  const list =
    document.getElementById(
      "participantList"
    );


  /* Remove empty message */

  const empty =
    list.querySelector(".empty");

  if (empty) {
    empty.remove();
  }


  const id =
    "participant-" +
    String(uid)
      .replace(/[^a-zA-Z0-9_-]/g, "");


  if (
    document.getElementById(id)
  ) {
    return;
  }


  const div =
    document.createElement("div");

  div.className =
    "participant";

  div.id = id;


  if (local) {

    div.textContent =
      "🎤 " +
      name +
      " (You)";

  } else {

    div.textContent =
      "🎤 Participant " +
      uid;

  }


  list.appendChild(div);

  updateParticipantCount();

}


/* --------------------------------
   REMOVE PARTICIPANT
-------------------------------- */

function removeParticipant(uid) {

  const id =
    "participant-" +
    String(uid)
      .replace(/[^a-zA-Z0-9_-]/g, "");


  const element =
    document.getElementById(id);


  if (element) {
    element.remove();
  }


  const list =
    document.getElementById(
      "participantList"
    );


  if (
    list.children.length === 0
  ) {

    const empty =
      document.createElement("div");

    empty.className =
      "empty";

    empty.textContent =
      "No other participants yet.";

    list.appendChild(empty);

  }


  updateParticipantCount();

}


/* --------------------------------
   PARTICIPANT COUNT
-------------------------------- */

function updateParticipantCount() {

  const list =
    document.getElementById(
      "participantList"
    );

  const count =
    list.querySelectorAll(
      ".participant"
    ).length;


  document.getElementById(
    "participantCount"
  ).textContent = count;

}


/* --------------------------------
   MUTE / UNMUTE
-------------------------------- */

async function toggleMute() {

  if (!localAudioTrack) {
    return;
  }


  muted = !muted;


  await localAudioTrack.setEnabled(
    !muted
  );


  document.getElementById(
    "muteButton"
  ).textContent =
    muted
      ? "🔇 Unmute"
      : "🎤 Mute";

}


/* --------------------------------
   LEAVE ROOM
-------------------------------- */

async function leaveRoom() {

  try {

    if (localAudioTrack) {

      localAudioTrack.stop();

      localAudioTrack.close();

      localAudioTrack = null;

    }


    if (client) {

      await client.leave();

      client = null;

    }

  } catch (error) {

    console.error(
      "Leave error:",
      error
    );

  } finally {

    muted = false;

    currentChannel = null;

    currentUid = null;

    currentName = null;


    document
      .getElementById("room")
      .classList.remove("active");


    document
      .getElementById("joinCard")
      .style.display = "block";


    document
      .getElementById("participantList")
      .innerHTML = "";


    document.getElementById(
      "participantCount"
    ).textContent = "0";


    document.getElementById(
      "muteButton"
    ).textContent = "🎤 Mute";


    setStatus(
      "You have left the prayer room."
    );

  }

}


/* --------------------------------
   CLEAN UP WHEN PAGE CLOSES
-------------------------------- */

window.addEventListener(
  "beforeunload",
  () => {

    if (localAudioTrack) {

      localAudioTrack.stop();
      localAudioTrack.close();

    }

    if (client) {
      client.leave();
    }

  }
);

</script>

</body>
</html>
