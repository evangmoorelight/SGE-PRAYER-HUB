     HEADER
========================= -->

<header>

  <!-- KBLC LOGO -->
  <img
    src="kblc-logo.png"
    alt="KBLC Logo"
    class="site-logo"
  >

  <h1>SGE PRAYER HUB</h1>

  <p>Connect • Pray • Believe • Grow</p>

</header>


<!-- =========================
     JOIN CARD
========================= -->

<section class="card" id="joinCard">

  <h2>Join Prayer Room</h2>

  <div class="input-group">

    <label for="name">
      Your Name
    </label>

    <input
      id="name"
      type="text"
      placeholder="Enter your name"
      maxlength="40"
      autocomplete="name"
    >

  </div>


  <div class="input-group">

    <label for="roomName">
      Prayer Room
    </label>

    <input
      id="roomName"
      type="text"
      placeholder="Example: Morning Prayer"
      maxlength="50"
    >

  </div>


  <button
    class="primary-button"
    id="joinButton"
    onclick="joinRoom()"
  >
    🎙️ Join Prayer Room
  </button>


  <div id="status">
    Enter your name and prayer room to join.
  </div>

</section>


<!-- =========================
     ROOM CARD
========================= -->

<section class="card" id="roomCard">

  <div class="room-header">

    <div
      class="room-title"
      id="roomTitle"
    >
      Prayer Room
    </div>

    <div class="live-badge">
      <span class="live-dot"></span>
      LIVE
    </div>

  </div>


  <div
    class="connection"
    id="connectionStatus"
  >
    Connecting...
  </div>


  <!-- PARTICIPANTS -->

  <div class="participants-header">

    <h3>
      🙏 People in Prayer
    </h3>

    <span id="participantCount">
      0
    </span>

  </div>


  <ul id="participantList"></ul>


  <!-- CONTROLS -->

  <div class="controls">

    <button
      class="secondary-button"
      id="muteButton"
      onclick="toggleMute()"
    >
      🔇 Mute Microphone
    </button>


    <button
      class="danger-button"
      onclick="leaveRoom()"
    >
      🚪 Leave Prayer Room
    </button>

  </div>

</section>


<footer>
  SGE PRAYER HUB • Connect • Pray • Believe • Grow
</footer>

  </div>  <script>

    /* =========================================
       AGORA CONFIGURATION
    ========================================= */

    const APP_ID =
      "aaaf093cb1944721bf39fb62659394a2";


    /* =========================================
       GLOBAL VARIABLES
    ========================================= */

    let client = null;

    let localAudioTrack = null;

    let currentChannel = "";

    let currentUid = null;

    let currentName = "";

    let muted = false;


    /* =========================================
       STATUS
    ========================================= */

    function setStatus(message) {

      document.getElementById("status").textContent =
        message;

    }


    /* =========================================
       CREATE ROOM NAME
    ========================================= */

    function createChannelName(roomName) {

      return roomName
        .trim()
        .replace(/\s+/g, "-")
        .replace(/[^a-zA-Z0-9_-]/g, "")
        .substring(0, 50);

    }


    /* =========================================
       CREATE UNIQUE UID
    ========================================= */

    function createUid() {

      return Math.floor(
        100000000 +
        Math.random() * 900000000
      );

    }


    /* =========================================
       GET AGORA TOKEN
    ========================================= */

    async function getToken(channelName, uid) {

      const response = await fetch(
        "/api/token",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            channelName: channelName,
            uid: uid
          })
        }
      );


      if (!response.ok) {

        throw new Error(
          "Token server returned HTTP " +
          response.status
        );

      }


      const data =
        await response.json();


      if (!data.token) {

        throw new Error(
          "No Agora token was returned by /api/token"
        );

      }


      return data.token;

    }


    /* =========================================
       JOIN ROOM
    ========================================= */

    async function joinRoom() {

      const nameInput =
        document.getElementById("name");

      const roomInput =
        document.getElementById("roomName");


      currentName =
        nameInput.value.trim();


      const enteredRoom =
        roomInput.value.trim();


      if (!currentName) {

        setStatus(
          "Please enter your name."
        );

        nameInput.focus();

        return;

      }


      if (!enteredRoom) {

        setStatus(
          "Please enter a prayer room name."
        );

        roomInput.focus();

        return;

      }


      currentChannel =
        createChannelName(
          enteredRoom
        );


      if (!currentChannel) {

        setStatus(
          "Please enter a valid prayer room name."
        );

        return;

      }


      try {

        setStatus(
          "Connecting to prayer room..."
        );


        document.getElementById(
          "joinButton"
        ).disabled = true;


        /*
          Create Agora client
        */

        client =
          AgoraRTC.createClient({
            mode: "rtc",
            codec: "vp8"
          });


        /*
          Handle remote users publishing audio
        */

        client.on(
          "user-published",
          async (
            user,
            mediaType
          ) => {

            try {

              await client.subscribe(
                user,
                mediaType
              );


              if (
                mediaType === "audio"
              ) {

                user.audioTrack.play();

              }

            } catch (error) {

              console.error(
                "Subscribe error:",
                error
              );

            }

          }
        );


        /*
          Handle users leaving
        */

        client.on(
          "user-unpublished",
          (
            user,
            mediaType
          ) => {

            if (
              mediaType === "audio"
            ) {

              removeParticipant(
                user.uid
              );

            }

          }
        );


        client.on(
          "user-left",
          (
            user
          ) => {

            removeParticipant(
              user.uid
            );

          }
        );


        /*
          Connection state
        */

        client.on(
          "connection-state-change",
          (
            curState,
            prevState
          ) => {

            console.log(
              "Agora connection:",
              prevState,
              "→",
              curState
            );


            const connectionStatus =
              document.getElementById(
                "connectionStatus"
              );


            if (
              curState === "CONNECTED"
            ) {

              connectionStatus.textContent =
                "Connected to prayer room";

            }

            else if (
              curState === "RECONNECTING"
            ) {

              connectionStatus.textContent =
                "Reconnecting...";

            }

            else if (
              curState === "DISCONNECTED"
            ) {

              connectionStatus.textContent =
                "Disconnected";

            }

          }
        );


        /*
          Generate UID
        */

        currentUid =
          createUid();


        /*
          Get token from Vercel API
        */

        const token =
          await getToken(
            currentChannel,
            currentUid
          );


        /*
          Join Agora channel
        */

        await client.join(
          APP_ID,
          currentChannel,
          token,
          currentUid
        );


        /*
          Create microphone
        */

        localAudioTrack =
          await AgoraRTC.createMicrophoneAudioTrack();


        /*
          Publish microphone
        */

        await client.publish(
          [localAudioTrack]
        );


        /*
          Update interface
        */

        document.getElementById(
          "joinCard"
        ).style.display = "none";


        document.getElementById(
          "roomCard"
        ).style.display = "block";


        document.getElementById(
          "roomTitle"
        ).textContent =
          enteredRoom;


        document.getElementById(
          "connectionStatus"
        ).textContent =
          "Connected to prayer room";


        setStatus(
          "You are now connected."
        );


        /*
          Add yourself to participant list
        */

        addParticipant(
          currentUid,
          currentName,
          true
        );


        /*
          Get existing remote users
        */

        client.remoteUsers.forEach(
          user => {

            addParticipant(
              user.uid,
              "Prayer Participant",
              false
            );

          }
        );


      } catch (error) {

        console.error(
          "Join error:",
          error
        );


        let message =
          "Unable to join prayer room.";


        if (
          error &&
          error.message
        ) {

          message =
            error.message;

        }


        setStatus(
          message
        );


        document.getElementById(
          "joinButton"
        ).disabled = false;


        /*
          Clean up if joining failed
        */

        try {

          if (localAudioTrack) {

            localAudioTrack.close();

            localAudioTrack = null;

          }


          if (client) {

            await client.leave();

            client = null;

          }

        } catch (cleanupError) {

          console.error(
            cleanupError
          );

        }

      }

    }


    /* =========================================
       ADD PARTICIPANT
    ========================================= */

    function addParticipant(
      uid,
      name,
      isSelf = false
    ) {

      const list =
        document.getElementById(
          "participantList"
        );


      const id =
        "participant-" + uid;


      if (
        document.getElementById(id)
      ) {

        return;

      }


      const li =
        document.createElement("li");


      li.className =
        "participant";


      li.id =
        id;


      const avatar =
        document.createElement("div");


      avatar.className =
        "participant-avatar";


      avatar.textContent =
        (name || "P")
          .charAt(0)
          .toUpperCase();


      const nameElement =
        document.createElement("div");


      nameElement.className =
        "participant-name";


      nameElement.textContent =
        name || "Prayer Participant";


      if (isSelf) {

        const badge =
          document.createElement("span");


        badge.className =
          "you-badge";


        badge.textContent =
          " YOU";


        nameElement.appendChild(
          badge
        );

      }


      li.appendChild(
        avatar
      );


      li.appendChild(
        nameElement
      );


      list.appendChild(
        li
      );


      updateParticipantCount();

    }


    /* =========================================
       REMOVE PARTICIPANT
    ========================================= */

    function removeParticipant(
      uid
    ) {

      const element =
        document.getElementById(
          "participant-" + uid
        );


      if (element) {

        element.remove();

      }


      updateParticipantCount();

    }


    /* =========================================
       PARTICIPANT COUNT
    ========================================= */

    function updateParticipantCount() {

      const list =
        document.getElementById(
          "participantList"
        );


      const count =
        list.children.length;


      document.getElementById(
        "participantCount"
      ).textContent =
        count;

    }


    /* =========================================
       MUTE / UNMUTE
    ========================================= */

    async function toggleMute() {

      if (!localAudioTrack) {

        return;

      }


      muted =
        !muted;


      await localAudioTrack.setEnabled(
        !muted
      );


      const button =
        document.getElementById(
          "muteButton"
        );


      if (muted) {

        button.textContent =
          "🎙️ Unmute Microphone";

      } else {

        button.textContent =
          "🔇 Mute Microphone";

      }

    }


    /* =========================================
       LEAVE ROOM
    ========================================= */

    async function leaveRoom() {

      try {

        if (localAudioTrack) {

          localAudioTrack.stop();

          localAudioTrack.close();

          localAudioTrack =
            null;

        }


        if (client) {

          await client.leave();

          client = null;

        }

      } catch (error) {

        console.error(
          "Leave error:",
          error
        );

      }


      document.getElementById(
        "roomCard"
      ).style.display = "none";


      document.getElementById(
        "joinCard"
      ).style.display = "block";


      document.getElementById(
        "joinButton"
      ).disabled = false;


      document.getElementById(
        "participantList"
      ).innerHTML = "";


      document.getElementById(
        "participantCount"
      ).textContent = "0";


      document.getElementById(
        "connectionStatus"
      ).textContent =
        "Disconnected";


      document.getElementById(
        "muteButton"
      ).textContent =
        "🔇 Mute Microphone";


      muted = false;

      currentChannel = "";

      currentUid = null;

      setStatus(
        "You have left the prayer room."
      );

    }


    /* =========================================
       CLEANUP WHEN PAGE CLOSES
    ========================================= */

    window.addEventListener(
      "beforeunload",
      async () => {

        try {

          if (localAudioTrack) {

            localAudioTrack.stop();

            localAudioTrack.close();

          }


          if (client) {

            await client.leave();

          }

        } catch (error) {

          console.error(
            error
          );

        }

      }
    );

  </script></body>
